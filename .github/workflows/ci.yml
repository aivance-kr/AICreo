name: CI

on:
  pull_request:
    branches: [main]     # dev 로 가는 PR 에서는 돌지 않는다 — 검증 게이트는 로컬(pre-push 훅)에서 끝낸다.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} - 정적분석 · 스타일 · 테스트
    # self-hosted(macOS) 러너는 `services:` 도커 컨테이너를 지원하지 않는다
    # (GitHub Actions 서비스 컨테이너는 Linux 러너 전용). 대신 아래에서
    # MySQL을 docker run으로 직접 띄우고 잡 종료 시 정리한다.
    runs-on: [self-hosted, macOS, ARM64]

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 테스트용 .env 작성
        # Composer가 스크립트("composer test")를 하위 프로세스로 실행할 때
        # 점(.)이 포함된 job-level env 키(database.tests.*)를 제대로 전달하지
        # 못해 기본 그룹(hostname=localhost, 하드코딩 port=3306)으로 접속하며
        # 이 러너의 시스템 mysqld에 "Access denied"로 막히는 문제가 있었다
        # (vendor/bin/phpunit 직접 호출은 정상 — composer 스크립트 경유만 깨짐).
        # .env 파일은 CI4 Dotenv가 직접 읽어 이 문제를 우회한다.
        run: |
          cat > .env <<'ENVEOF'
          database.tests.hostname = 127.0.0.1
          database.tests.database = ci4_agency_test
          database.tests.username = root
          database.tests.password = root
          database.tests.DBDriver = MySQLi
          database.tests.port = 43306
          ENVEOF

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f ci-mysql-${{ github.run_id }} 2>/dev/null || true
          # 이 Mac은 여러 저장소의 self-hosted 러너를 동시에 호스팅한다.
          # 시스템 MySQL(3306)·AIFid(13306)·AILicet/AITessera(23306) 등과
          # 겹치지 않는 43306을 쓴다 — 새 포트를 고를 땐 다른 저장소
          # .github/workflows/ci.yml 도 함께 grep 해서 겹치지 않는지 확인할 것.
          docker run -d --name ci-mysql-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ci4_agency_test \
            -p 43306:3306 \
            mysql:8.0
          # 공식 mysql 이미지는 초기화 중 임시 서버로 한 번 떴다가 재시작한다.
          # mysqladmin ping은 그 임시 서버 단계에서도 성공해버려 재시작 중
          # 붙으면 "server has gone away"가 나므로, 실제 인증 쿼리가
          # 성공할 때까지(=재시작이 끝날 때까지) 재시도한다.
          for i in $(seq 1 60); do
            docker exec ci-mysql-${{ github.run_id }} mysql -uroot -proot -e "SELECT 1" ci4_agency_test >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Code style (php-cs-fixer)
        run: composer cs

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (PHPUnit)
        run: composer test

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f ci-mysql-${{ github.run_id }} 2>/dev/null || true

  coverage:
    name: 커버리지 리포트
    # self-hosted(macOS) 러너는 services: 를 지원하지 않아 MySQL을 직접 기동한다.
    runs-on: [self-hosted, macOS, ARM64]
    # CI 자체가 dev → main 배포 PR 에서만 도므로 quality 잡과 함께 항상 실행된다.
    # 커버리지 결과는 job summary에서 확인한다.

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 테스트용 .env 작성
        # quality 잡과 동일한 이유 (composer 스크립트 경유 시 점 포함 env 키 유실).
        run: |
          cat > .env <<'ENVEOF'
          database.tests.hostname = 127.0.0.1
          database.tests.database = ci4_agency_test
          database.tests.username = root
          database.tests.password = root
          database.tests.DBDriver = MySQLi
          database.tests.port = 43306
          ENVEOF

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f ci-mysql-coverage-${{ github.run_id }} 2>/dev/null || true
          docker run -d --name ci-mysql-coverage-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ci4_agency_test \
            -p 43306:3306 \
            mysql:8.0
          # quality 잡과 동일한 이유 — 실제 인증 쿼리가 성공할 때까지 재시도.
          for i in $(seq 1 60); do
            docker exec ci-mysql-coverage-${{ github.run_id }} mysql -uroot -proot -e "SELECT 1" ci4_agency_test >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, mysqli
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Tests with coverage
        run: |
          mkdir -p build
          vendor/bin/phpunit \
            --coverage-text=build/coverage.txt \
            --coverage-cobertura=build/cobertura.xml

      - name: Append coverage to job summary
        if: always()
        run: |
          {
            echo '### 📊 커버리지'
            echo '```'
            cat build/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f ci-mysql-coverage-${{ github.run_id }} 2>/dev/null || true

  notify:
    name: Slack 알림
    runs-on: ubuntu-latest
    needs: [quality, coverage]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slack 알림 전송
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ (needs.quality.result == 'success' && needs.coverage.result == 'success') && 'success' || 'failure' }}
          title: CI
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

name: CI

on:
  pull_request:
    branches: [main]     # dev 로 가는 PR 에서는 돌지 않는다 — 검증 게이트는 로컬(pre-push 훅)에서 끝낸다.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} - 정적분석 · 스타일 · 테스트
    # self-hosted(macOS) 러너는 `services:` 도커 컨테이너를 지원하지 않는다
    # (GitHub Actions 서비스 컨테이너는 Linux 러너 전용). 대신 아래에서
    # MySQL을 docker run으로 직접 띄우고 잡 종료 시 정리한다.
    runs-on: [self-hosted, macOS, ARM64]

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    env:
      database.tests.hostname: 127.0.0.1
      database.tests.database: ci4_agency_test
      database.tests.username: root
      database.tests.password: root
      database.tests.DBDriver: MySQLi
      database.tests.port: 23306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f ci-mysql-${{ github.run_id }} 2>/dev/null || true
          # 이 러너에는 시스템 MySQL(mysqld)이 이미 3306을 상시 점유하고 있고
          # 다른 저장소 CI(예: AIFid, 13306)와도 겹치지 않게 23306으로 띄운다.
          docker run -d --name ci-mysql-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ci4_agency_test \
            -p 23306:3306 \
            mysql:8.0
          for i in $(seq 1 30); do
            docker exec ci-mysql-${{ github.run_id }} mysqladmin ping -proot --silent && break
            sleep 2
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Code style (php-cs-fixer)
        run: composer cs

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (PHPUnit)
        run: composer test

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f ci-mysql-${{ github.run_id }} 2>/dev/null || true

  coverage:
    name: 커버리지 리포트
    # self-hosted(macOS) 러너는 services: 를 지원하지 않아 MySQL을 직접 기동한다.
    runs-on: [self-hosted, macOS, ARM64]
    # CI 자체가 dev → main 배포 PR 에서만 도므로 quality 잡과 함께 항상 실행된다.
    # 커버리지 결과는 job summary에서 확인한다.

    permissions:
      contents: read

    env:
      database.tests.hostname: 127.0.0.1
      database.tests.database: ci4_agency_test
      database.tests.username: root
      database.tests.password: root
      database.tests.DBDriver: MySQLi
      database.tests.port: 23306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f ci-mysql-coverage-${{ github.run_id }} 2>/dev/null || true
          docker run -d --name ci-mysql-coverage-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ci4_agency_test \
            -p 23306:3306 \
            mysql:8.0
          for i in $(seq 1 30); do
            docker exec ci-mysql-coverage-${{ github.run_id }} mysqladmin ping -proot --silent && break
            sleep 2
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, mysqli
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Tests with coverage
        run: |
          mkdir -p build
          vendor/bin/phpunit \
            --coverage-text=build/coverage.txt \
            --coverage-cobertura=build/cobertura.xml

      - name: Append coverage to job summary
        if: always()
        run: |
          {
            echo '### 📊 커버리지'
            echo '```'
            cat build/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f ci-mysql-coverage-${{ github.run_id }} 2>/dev/null || true

  notify:
    name: Slack 알림
    runs-on: ubuntu-latest
    needs: [quality, coverage]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slack 알림 전송
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ (needs.quality.result == 'success' && needs.coverage.result == 'success') && 'success' || 'failure' }}
          title: CI
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

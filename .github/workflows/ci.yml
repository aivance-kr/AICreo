name: CI

on:
  pull_request:
    branches: [main]     # dev 로 가는 PR 에서는 돌지 않는다 — 검증 게이트는 로컬(pre-push 훅)에서 끝낸다.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} - 정적분석 · 스타일 · 테스트
    # self-hosted Linux 러너는 services: 도커 컨테이너도 지원하지만,
    # 조직 러너 1개를 여러 워크플로우/잡이 공유하므로 포트 충돌을 피하기 위해
    # 계속 docker run 으로 직접 띄우고 잡 종료 시 정리한다.
    runs-on: [self-hosted, Linux, X64, docker]

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 테스트용 .env 작성
        # Composer가 스크립트("composer test")를 하위 프로세스로 실행할 때
        # 점(.)이 포함된 job-level env 키(database.tests.*)를 제대로 전달하지
        # 못해 기본 그룹(hostname=localhost, 하드코딩 port=3306)으로 접속하며
        # 이 러너의 시스템 mysqld에 "Access denied"로 막히는 문제가 있었다
        # (vendor/bin/phpunit 직접 호출은 정상 — composer 스크립트 경유만 깨짐).
        # .env 파일은 CI4 Dotenv가 직접 읽어 이 문제를 우회한다.
        run: |
          cat > .env <<'ENVEOF'
          database.tests.hostname = ci-mysql-${{ github.run_id }}
          database.tests.database = ci4_agency_test
          database.tests.username = root
          database.tests.password = root
          database.tests.DBDriver = MySQLi
          database.tests.port = 3306
          ENVEOF

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f ci-mysql-${{ github.run_id }} 2>/dev/null || true
          # 러너가 도커 컨테이너라 호스트에 게시한 포트(127.0.0.1)에는 닿지 못한다
          # ("Connection refused"). 실행별 전용 네트워크에 러너와 MySQL 을 같이 붙이고
          # 컨테이너 이름으로 접속한다 — 호스트 포트를 쓰지 않아 잡끼리 겹치지 않는다.
          docker network create ci-net-${{ github.run_id }}
          docker network connect ci-net-${{ github.run_id }} "$(hostname)"
          docker run -d --name ci-mysql-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ci4_agency_test \
            --network ci-net-${{ github.run_id }} \
            --tmpfs /var/lib/mysql \
            mysql:8.0 \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-flush-method=nosync \
            --sync-binlog=0 \
            --innodb-redo-log-capacity=536870912
          # 포트 바인딩 실패를 조용히 넘기지 않는다.
          # docker run -d 는 포트를 못 잡아도 컨테이너 ID 를 찍고 성공한 것처럼
          # 끝난 뒤 컨테이너만 죽는다. 그러면 아래 대기 루프가 60초를 헛돌고
          # 테스트에서 "Connection refused" 143건으로만 드러나 원인이 가려진다.
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' ci-mysql-${{ github.run_id }})" != "true" ]; then
            echo "::error::MySQL 컨테이너가 기동 직후 종료됐습니다 (네트워크/이미지 문제 가능성)"
            docker logs ci-mysql-${{ github.run_id }} 2>&1 | tail -20
            exit 1
          fi
          # 공식 mysql 이미지는 초기화 중 임시 서버로 한 번 떴다가 재시작한다.
          # mysqladmin ping은 그 임시 서버 단계에서도 성공해버려 재시작 중
          # 붙으면 "server has gone away"가 나므로, 실제 인증 쿼리가
          # 성공할 때까지(=재시작이 끝날 때까지) 재시도한다.
          ready=0
          for i in $(seq 1 60); do
            docker exec ci-mysql-${{ github.run_id }} mysql -uroot -proot -e "SELECT 1" ci4_agency_test >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::MySQL 이 60초 안에 준비되지 않았습니다"
            docker logs ci-mysql-${{ github.run_id }} 2>&1 | tail -20
            exit 1
          fi

      - name: PHP 8.5+ 보장 (러너 이미지 편차 대응)
        run: |
          APT="sudo apt-get -o DPkg::Lock::Timeout=300"
          php_ok() { command -v php >/dev/null && php -r 'exit(version_compare(PHP_VERSION, "8.5", ">=") ? 0 : 1);'; }
          # 조직 러너 이미지가 제각각이다 — ondrej PPA 가 붙은 러너는 php-cli 가 8.5 지만,
          # 네이티브 Ubuntu 24.04 러너(runner-03)는 8.3.6 이라 composer.json 요구를 못 채워
          # composer install 이 실패했다. 8.5 미만이면 PPA 로 8.5 를 설치해 기본 php 로 지정한다.
          # (Ubuntu 26.04 러너는 네이티브가 8.5 라 이 분기를 타지 않는다.)
          if ! php_ok; then
            $APT update -qq
            command -v php >/dev/null || $APT install -y --no-install-recommends php-cli
            if ! php_ok; then
              $APT install -y --no-install-recommends software-properties-common
              sudo add-apt-repository -y ppa:ondrej/php
              $APT update -qq
              $APT install -y --no-install-recommends php8.5-cli
              sudo update-alternatives --set php /usr/bin/php8.5
            fi
          fi
          # 확장은 지금 PATH 의 php 버전에 맞춰 버전 명시 패키지로, 없는 것만 설치한다
          # (버전 없는 php-intl 등은 다른 버전을 끌어와 쓰는 php 에 안 붙을 수 있다).
          V="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
          MISSING=""
          for item in mbstring:mbstring intl:intl mysql:mysqli xml:dom curl:curl zip:zip sqlite3:sqlite3; do
            php -m | grep -qix "${item#*:}" || MISSING="$MISSING php${V}-${item%%:*}"
          done
          # 커버리지 드라이버(pcov/xdebug)가 없으면 phpunit 이 경고 → failOnWarning 으로 실패한다.
          php -m | grep -qiE '^(pcov|xdebug)$' || MISSING="$MISSING php${V}-xdebug"
          if [ -n "$MISSING" ]; then
            echo "설치 필요:$MISSING"
            $APT update -qq
            $APT install -y --no-install-recommends $MISSING
          fi
          command -v composer >/dev/null || $APT install -y --no-install-recommends composer
          php -v
          composer --version

      - name: PHP 환경 확인
        run: |
          php --version
          composer --version
          php -r '$required = ["intl", "mbstring", "mysqli"]; foreach ($required as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "필수 PHP 확장이 없습니다: {$extension}\n"); exit(1); } } if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION < 5) { fwrite(STDERR, "PHP 8.5 이상이 필요합니다.\n"); exit(1); }'

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Code style (php-cs-fixer)
        run: composer cs

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (PHPUnit)
        run: composer test

      - name: 컨테이너 정리
        if: always()
        # -v 를 빼면 컨테이너만 지워지고 /var/lib/mysql 익명 볼륨이 남는다.
        # 매 실행마다 수백 MB 씩 쌓여 결국 러너의 Docker 디스크가 가득 차고,
        # MySQL 이 "No space left on device" 로 기동조차 못 하게 된다.
        run: |
          docker rm -f -v ci-mysql-${{ github.run_id }} 2>/dev/null || true
          docker network disconnect -f ci-net-${{ github.run_id }} "$(hostname)" 2>/dev/null || true
          docker network rm ci-net-${{ github.run_id }} 2>/dev/null || true

  coverage:
    name: 커버리지 리포트
    # quality 잡과 동일한 이유(포트 충돌 회피)로 MySQL을 직접 기동한다.
    runs-on: [self-hosted, Linux, X64, docker]
    # CI 자체가 dev → main 배포 PR 에서만 도므로 quality 잡과 함께 항상 실행된다.
    # 커버리지 결과는 job summary에서 확인한다.

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 테스트용 .env 작성
        # quality 잡과 동일한 이유 (composer 스크립트 경유 시 점 포함 env 키 유실).
        run: |
          cat > .env <<'ENVEOF'
          database.tests.hostname = ci-mysql-coverage-${{ github.run_id }}
          database.tests.database = ci4_agency_test
          database.tests.username = root
          database.tests.password = root
          database.tests.DBDriver = MySQLi
          database.tests.port = 3306
          ENVEOF

      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f ci-mysql-coverage-${{ github.run_id }} 2>/dev/null || true
          # 러너가 도커 컨테이너라 호스트에 게시한 포트(127.0.0.1)에는 닿지 못한다
          # ("Connection refused"). 실행별 전용 네트워크에 러너와 MySQL 을 같이 붙이고
          # 컨테이너 이름으로 접속한다 — 호스트 포트를 쓰지 않아 잡끼리 겹치지 않는다.
          docker network create ci-net-coverage-${{ github.run_id }}
          docker network connect ci-net-coverage-${{ github.run_id }} "$(hostname)"
          docker run -d --name ci-mysql-coverage-${{ github.run_id }} \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ci4_agency_test \
            --network ci-net-coverage-${{ github.run_id }} \
            --tmpfs /var/lib/mysql \
            mysql:8.0 \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-flush-method=nosync \
            --sync-binlog=0 \
            --innodb-redo-log-capacity=536870912
          # 포트 바인딩 실패를 조용히 넘기지 않는다 — 컨테이너가 살아있는지 먼저 본다.
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' ci-mysql-coverage-${{ github.run_id }})" != "true" ]; then
            echo "::error::MySQL 컨테이너가 기동 직후 종료됐습니다 (네트워크/이미지 문제 가능성)"
            docker logs ci-mysql-coverage-${{ github.run_id }} 2>&1 | tail -20
            exit 1
          fi
          # quality 잡과 동일한 이유 — 실제 인증 쿼리가 성공할 때까지 재시도.
          ready=0
          for i in $(seq 1 60); do
            docker exec ci-mysql-coverage-${{ github.run_id }} mysql -uroot -proot -e "SELECT 1" ci4_agency_test >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::MySQL 이 60초 안에 준비되지 않았습니다"
            docker logs ci-mysql-coverage-${{ github.run_id }} 2>&1 | tail -20
            exit 1
          fi

      - name: PHP 8.5+ 보장 (러너 이미지 편차 대응)
        run: |
          APT="sudo apt-get -o DPkg::Lock::Timeout=300"
          php_ok() { command -v php >/dev/null && php -r 'exit(version_compare(PHP_VERSION, "8.5", ">=") ? 0 : 1);'; }
          # 조직 러너 이미지가 제각각이다 — ondrej PPA 가 붙은 러너는 php-cli 가 8.5 지만,
          # 네이티브 Ubuntu 24.04 러너(runner-03)는 8.3.6 이라 composer.json 요구를 못 채워
          # composer install 이 실패했다. 8.5 미만이면 PPA 로 8.5 를 설치해 기본 php 로 지정한다.
          # (Ubuntu 26.04 러너는 네이티브가 8.5 라 이 분기를 타지 않는다.)
          if ! php_ok; then
            $APT update -qq
            command -v php >/dev/null || $APT install -y --no-install-recommends php-cli
            if ! php_ok; then
              $APT install -y --no-install-recommends software-properties-common
              sudo add-apt-repository -y ppa:ondrej/php
              $APT update -qq
              $APT install -y --no-install-recommends php8.5-cli
              sudo update-alternatives --set php /usr/bin/php8.5
            fi
          fi
          # 확장은 지금 PATH 의 php 버전에 맞춰 버전 명시 패키지로, 없는 것만 설치한다
          # (버전 없는 php-intl 등은 다른 버전을 끌어와 쓰는 php 에 안 붙을 수 있다).
          V="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
          MISSING=""
          for item in mbstring:mbstring intl:intl mysql:mysqli xml:dom curl:curl zip:zip sqlite3:sqlite3; do
            php -m | grep -qix "${item#*:}" || MISSING="$MISSING php${V}-${item%%:*}"
          done
          # 커버리지 드라이버(pcov/xdebug)가 없으면 phpunit 이 경고 → failOnWarning 으로 실패한다.
          php -m | grep -qiE '^(pcov|xdebug)$' || MISSING="$MISSING php${V}-xdebug"
          if [ -n "$MISSING" ]; then
            echo "설치 필요:$MISSING"
            $APT update -qq
            $APT install -y --no-install-recommends $MISSING
          fi
          command -v composer >/dev/null || $APT install -y --no-install-recommends composer
          php -v
          composer --version

      - name: PHP 및 커버리지 확장 확인
        run: |
          php --version
          composer --version
          php -r '$required = ["intl", "mbstring", "mysqli", "xdebug"]; foreach ($required as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "필수 PHP 확장이 없습니다: {$extension}\n"); exit(1); } } if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION < 5) { fwrite(STDERR, "PHP 8.5 이상이 필요합니다.\n"); exit(1); }'

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Tests with coverage
        run: |
          mkdir -p build
          XDEBUG_MODE=coverage vendor/bin/phpunit \
            --coverage-text=build/coverage.txt \
            --coverage-cobertura=build/cobertura.xml

      - name: Append coverage to job summary
        if: always()
        run: |
          {
            echo '### 📊 커버리지'
            echo '```'
            if [ -f build/coverage.txt ]; then
              cat build/coverage.txt
            else
              echo '커버리지 리포트가 생성되지 않았습니다.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 컨테이너 정리
        if: always()
        # -v 를 빼면 컨테이너만 지워지고 /var/lib/mysql 익명 볼륨이 남는다.
        # 매 실행마다 수백 MB 씩 쌓여 결국 러너의 Docker 디스크가 가득 차고,
        # MySQL 이 "No space left on device" 로 기동조차 못 하게 된다.
        run: |
          docker rm -f -v ci-mysql-coverage-${{ github.run_id }} 2>/dev/null || true
          docker network disconnect -f ci-net-coverage-${{ github.run_id }} "$(hostname)" 2>/dev/null || true
          docker network rm ci-net-coverage-${{ github.run_id }} 2>/dev/null || true

  notify:
    name: Slack 알림
    runs-on: [self-hosted, Linux, X64, docker]
    needs: [quality, coverage]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slack 알림 전송
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ (needs.quality.result == 'success' && needs.coverage.result == 'success') && 'success' || 'failure' }}
          title: CI
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

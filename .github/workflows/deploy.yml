name: Deploy

# main 에 반영되는 순간 배포한다.
#
# 검증은 이미 끝나 있다 — main 으로 들어오는 경로는 `dev → main` 배포 PR 뿐이고,
# 그 PR 에서 CI(cs·analyse·test + coverage)가 돌아 통과해야만 머지할 수 있다.
#
# 예전에는 `workflow_run: workflows:[CI], branches:[main]` 으로 걸려 있었는데,
# CI 트리거가 `pull_request: [main]` 로 바뀌면서(#244) 이 연결이 조용히 끊겼다.
# pull_request 로 도는 CI 실행은 소속 브랜치가 head(dev)라 branches:[main] 필터에
# 걸리지 않기 때문이다. 그 결과 2026-07-16 이후 배포가 한 번도 실행되지 않았고,
# 머지는 됐는데 운영 서버만 옛 코드로 남아 있었다.
on:
  push:
    branches: [main]
  # Actions 탭에서 수동 실행 (배포 실패 후 재시도 등)
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 운영 서버 배포 (SSH)
    runs-on: ubuntu-latest

    # 조건 없이 실행한다.
    # 예전 조건은 github.event.workflow_run.conclusion 을 봤는데, push 트리거에는
    # 그 값이 존재하지 않아 그대로 두면 잡이 통째로 건너뛰어진다.
    # 검증은 dev → main PR 의 CI 가 이미 담당한다.

    steps:
      - name: SSH 접속 후 배포 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "▶ 최신 코드 가져오기"
            git fetch --all --prune
            git reset --hard origin/main

            echo "▶ 의존성 설치 (운영용, dev 제외)"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "▶ 데이터베이스 마이그레이션"
            php spark migrate --all

            echo "▶ 캐시 초기화"
            php spark cache:clear

            echo "✅ 배포 완료: $(git rev-parse --short HEAD)"

      - name: Checkout
        if: always()
        uses: actions/checkout@v4

      - name: Slack 알림 전송
        if: always()
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ job.status }}
          title: 배포
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
